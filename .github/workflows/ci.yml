name: CI / CD

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - ci/**
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  publish-sdk:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run --filter './packages/*' build

      - name: Set prerelease version
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          SHA=$(git rev-parse --short HEAD)
          VER=$(jq -r '.version' packages/shared/package.json)
          (cd packages/shared && bun pm version "$VER-ci.$SHA" --no-git-tag-version)
          (cd packages/sdk && bun pm version "$VER-ci.$SHA" --no-git-tag-version)

      - name: Replace workspace:* with published version (workaround for oven-sh/bun#20477)
        run: |
          VER=$(jq -r '.version' packages/shared/package.json)
          sed -i "s/workspace:\*/$VER/g" packages/sdk/package.json

      # --- Publish to GitHub Packages ---
      - name: Configure for GitHub Packages
        run: |
          echo "@xartifact:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Publish @xartifact/x-tinker-shared to GitHub Packages
        run: bun publish --tag latest
        working-directory: packages/shared

      - name: Publish @xartifact/x-tinker-sdk to GitHub Packages
        run: bun publish --tag latest
        working-directory: packages/sdk

      # --- Publish to npm ---
      - name: Configure for npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc

      - name: Publish @xartifact/x-tinker-shared to npm
        run: bun publish --tag latest
        working-directory: packages/shared

      - name: Publish @xartifact/x-tinker-sdk to npm
        run: bun publish --tag latest
        working-directory: packages/sdk

      - name: Restore workspace deps
        if: always()
        run: bun install

  docker:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker
    runs-on: self-hosted
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Deploy to x99 (~/Docker/x-tinker)
        env:
          # main 部署 latest；其他分支（ci/**, feat/**, fix/**）部署 alpha
          IMAGE_TAG: ${{ (github.ref == 'refs/heads/main') && 'latest' || 'alpha' }}
          CONTAINER: x-tinker
          DEPLOY_DIR: ~/Docker/x-tinker
        run: |
          cd ${{ env.DEPLOY_DIR }}

          echo "Pulling image tag: $IMAGE_TAG"
          docker pull ghcr.io/${{ github.repository }}:$IMAGE_TAG

          echo "Starting services..."
          docker-compose up -d

          echo "Waiting for service to be ready..."
          MAX_RETRIES=30
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            CONTAINER_STATUS=$(docker inspect --format='{{.State.Status}}' ${{ env.CONTAINER }} 2>/dev/null || echo "unknown")
            if [ "$CONTAINER_STATUS" = "exited" ] || [ "$CONTAINER_STATUS" = "dead" ]; then
              echo "✗ Container has stopped (status: $CONTAINER_STATUS)"
              echo "Container logs:"
              docker-compose logs ${{ env.CONTAINER }}
              exit 1
            fi

            # 容器内健康探针（容器内端口始终 3200）
            HTTP_CODE=$(docker exec ${{ env.CONTAINER }} bun -e "fetch('http://localhost:3200/health').then(r=>console.log(r.status)).catch(()=>console.log(0))" 2>/dev/null || echo "0")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Service is healthy (HTTP 200)"
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "✗ Health check timeout after $MAX_RETRIES attempts (150s)"
              echo "Last HTTP code: $HTTP_CODE"
              echo "Container logs:"
              docker-compose logs --tail=50 ${{ env.CONTAINER }}
              exit 1
            fi

            echo "  Attempt $RETRY_COUNT/$MAX_RETRIES (HTTP: $HTTP_CODE), retrying in 5s..."
            sleep 5
          done

          echo ""
          echo "Container status:"
          docker-compose ps

          echo ""
          echo "Cleaning up old images..."
          docker image prune -f

          echo ""
          echo "✓ Deployment completed successfully"