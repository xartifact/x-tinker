services:
  tinker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: x-tinker
    ports:
      - "${PORT:-3200}:3200"
    environment:
      NODE_ENV: production
      PORT: 3200
      DB_DIR: /data
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      # Legacy single-project fallback, used by the default project when it
      # has no repo.projectPath in config. For multi-project, set each
      # project's repo.projectPath to /projects/<name> in the config panel.
      PROJECT_A_PATH: ${PROJECT_A_PATH:-/projects/default}
    volumes:
      - tinker_data:/data
      # All managed projects for source access — each project's
      # repo.projectPath points into /projects/<name>
      - ${PROJECTS_HOST_PATH:-./projects}:/projects:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  tinker_data:
    driver: local